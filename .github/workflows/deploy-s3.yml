name: Deploy Brello Website (Next.js) to AWS S3

on:
  push:
    branches:
      - main
      - uat
      - prod
      - develop

jobs:
  build-and-deploy:
    name: Build Next.js Static Export & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export (out/)
        env:
          VITE_BRELLO_BASE_API: http://13.205.254.152:8000/api/v1
          NEXT_PUBLIC_BRELLO_BASE_API: http://13.205.254.152:8000/api/v1
          NEXT_PUBLIC_API_URL: http://13.205.254.152:8000/api/v1
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy out/ to S3 Bucket with Public ACL
        run: |
          aws s3 sync out/ s3://brello-website --acl public-read --delete
          echo "✅ Brello Website deployed to http://brello-website.s3-website.ap-south-1.amazonaws.com"
